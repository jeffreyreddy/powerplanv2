<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>S2 Power Plan Essentials</title>
    <style>
        #palette {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 16px;
        }
        .palette-device {
            width: 54px; height: 54px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
            font-size: 12px;
            cursor: grab;
            user-select: none;
            border: 2px solid #228;
            border-radius: 12px;
            background: #eff6ff;
            transition: box-shadow 0.12s;
        }
        .palette-device:active {
            box-shadow: 0 8px 18px #69a1;
        }
        #tent-area {
            width: 600px;
            height: 350px;
            border: 6px solid #64837D;
            background-color: #eef4ed;
            border-radius: 24px 24px 36px 36px;
            margin: 18px 0 8px 0;
            position: relative;
        }
        .device-icon {
            width: 48px; height: 48px;
            position: absolute;
            user-select: none;
            cursor: grab;
            transition: box-shadow 0.1s;
        }
        .device-icon .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #c0392b;
            color: #fff;
            font-size: 14px;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            text-align: center;
            line-height: 20px;
            cursor: pointer;
            border: 2px solid #fff;
            z-index: 10;
        }
        .device-icon.dragging {
            opacity: 0.6;
            z-index: 999;
            box-shadow: 0 6px 16px #5555;
            pointer-events: none;
        }
        #tent-total {
            font-size: 1.2em;
            font-weight: bold;
            position: absolute;
            bottom: 10px;
            left: 18px;
            background: rgba(255,255,255,0.8);
            padding: 2px 12px;
            border-radius: 1em;
            border: 1px solid #9993;
        }
        #layout-buttons {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>S2 Power Plan Essentials</h1>
    <hr>
    <h2>Device Palette</h2>
    <div id="palette"></div>
    <hr>
    <h2>Tent Device Layout</h2>
    <div id="layout-buttons">
        <button id="save-layout">Save Layout</button>
        <button id="load-layout">Load Layout</button>
    </div>
    <div id="tent-area">
        <span id="tent-total"></span>
    </div>
    <script src="drag-tent.js"></script>
</body>
</html>
